[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bibtex-zotero"
version = "1.0.0"
description = "Automate inserting native Zotero reference field codes into Microsoft Word (.docx) documents from BibTeX (.bib/.txt) files."
readme = "README.md"
authors = [
    { name = "Antigravity Systems & Contributor Community", email = "playground@antigravity.ai" }
]
license = { text = "MIT" }
keywords = ["zotero", "bibtex", "docx", "word", "csl", "openxml", "citations", "antigravity-skill"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
bibtex-zotero = "scripts.bibtex_to_zotero_word:main"

[project.urls]
"Homepage" = "https://github.com/your-username/bibtex-zotero"
"Bug Tracker" = "https://github.com/your-username/bibtex-zotero/issues"
